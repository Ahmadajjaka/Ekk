
name: Build Android APK (خردوات المامو)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'almamo123456' }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'almamo' }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'almamo123456' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check & unit tests
        run: |
          bun run lint
          npx --yes tsx --test src/utils/*.test.ts src/services/*.test.ts

      - name: Cache deterministic APK signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        uses: actions/cache@v4
        with:
          path: android/keystore
          key: almamo-release-keystore-v1

      - name: Prepare Keystore & Extract Fingerprints
        id: keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ env.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ env.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_ENV: ${{ env.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ env.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          mkdir -p android/keystore
          KS_PATH="${{ github.workspace }}/android/keystore/almamo-release.jks"

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KS_PATH"
          elif [ ! -f "$KS_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -storepass "$KEYSTORE_PASS" \
              -alias "$KEY_ALIAS_ENV" \
              -keypass "$KEY_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=AlMamo Hardware, OU=StorePOS, O=AlMamo, L=Store, ST=Tech, C=SY"
          fi

          {
            echo "ALMAMO_KEYSTORE_FILE=$KS_PATH"
            echo "ALMAMO_KEYSTORE_PASSWORD=$KEYSTORE_PASS"
            echo "ALMAMO_KEY_ALIAS=$KEY_ALIAS_ENV"
            echo "ALMAMO_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

          CERT_INFO=$(keytool -list -v -keystore "$KS_PATH" \
            -storepass "$KEYSTORE_PASS" -alias "$KEY_ALIAS_ENV")

          SHA1=$(echo "$CERT_INFO" | grep -E 'SHA1:' | head -n1 | sed 's/.*SHA1:[[:space:]]*//' | tr -d ' ')
          SHA256=$(echo "$CERT_INFO" | grep -E 'SHA256:' | head -n1 | sed 's/.*SHA256:[[:space:]]*//' | tr -d ' ')

          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

          SHA256_VAL="$SHA256" node -e "
            const fs = require('fs');
            const sha256 = process.env.SHA256_VAL;
            const payload = [{
              relation: ['delegate_permission/common.handle_all_urls'],
              target: {
                namespace: 'android_app',
                package_name: 'com.almamo.hardware',
                sha256_cert_fingerprints: sha256 ? [sha256] : []
              }
            }];
            fs.mkdirSync('public/.well-known', { recursive: true });
            fs.writeFileSync(
              'public/.well-known/assetlinks.json',
              JSON.stringify(payload, null, 2) + '\n'
            );
          "

          {
            echo "## Android Signing Fingerprints"
            echo "- Package ID: com.almamo.hardware"
            echo "- SHA-1: $SHA1"
            echo "- SHA-256: $SHA256"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Web Bundle
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: bun run build

      - name: Sync Web Bundle to Capacitor Android
        run: bun run apk:sync

      - name: Build Signed Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename Release APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk almamo-hardware-store.apk
          ls -lh almamo-hardware-store.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: almamo-hardware-store-apk
          path: almamo-hardware-store.apk
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: almamo-hardware-store.apk
          generate_release_notes: true
